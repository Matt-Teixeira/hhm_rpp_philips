# no "version" key
#
# ONE service on purpose. The legacy `app` service (stock node:lts, root,
# HOME=/tmp, no pg_net) and the shared node_mod_cache mount were deleted
# 2026-08-26: deps now live in-tree (build.sh), and runs use ge's shared
# image via app_tools — same cleanup siemens made 2026-08-25.

services:
  # Runtime service: ge's shared image (baked gosu entrypoint dropping to
  # RUN_USER, default svc). TAG: hhm_rpp:${IMAGE_TAG} is owned/built by
  # hhm_rpp_ge — see CLAUDE.md "KNOWN WARTS". Never build or retag it from
  # this repo.
  app_tools:
    image: hhm_rpp:${IMAGE_TAG}
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    working_dir: /workspace
    volumes:
      # 1) Project source → live edit on host reflects in container.
      #    node_modules is IN-TREE (installed by build.sh as the host user),
      #    so it rides along in this mount — no separate cache mount.
      - ./:/workspace

      # 2) Run logs. Host destination is env-dependent; defaults to the DEV
      #    path so a missing LOG_DIR fails safe (never writes /opt/run-logs).
      - ${LOG_DIR:-./utils/logger/logs}:/workspace/utils/logger/logs

      # 3) ACQ files (read-only). Same path on host and container because the
      #    code builds absolute paths from DATA_STORE_DEV on both sides.
      - ${DATA_STORE_DEV}:${DATA_STORE_DEV}:ro
    environment:
      # Intentionally unset in .env: empty -> baked entrypoint defaults to svc
      # (one place decides the production identity). Dev runs pass it on the
      # command line. ':-' silences the compose WARN.
      RUN_USER: ${RUN_USER:-}
      # Keep npm's cache ephemeral (avoids permission issues on bind mounts)
      NPM_CONFIG_CACHE: /tmp/.npm
    networks:
      - redis_net
      - pg_net

# Declare external networks
networks:
  redis_net:
    external: true
    name: redis-admin_redis_net
  pg_net:
    external: true
